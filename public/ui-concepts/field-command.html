<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>孤军 · 三套UI方案</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-width:0;height:100%;font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:#0d120f;color:#e3e6d9}button{font:inherit}button:focus-visible{outline:2px solid #e3c58e;outline-offset:3px}
    #studio{height:100vh;height:100dvh;display:flex;flex-direction:column;min-height:0}.studio-bar{padding:12px 22px;border-bottom:1px solid #4e5a4d;flex-shrink:0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#161e18}.studio-title{margin:0;font-size:14px;font-weight:500;line-height:1.6}.studio-title small{display:block;font-size:12px;font-weight:400;color:#b9c3b5}.studio-choices{display:flex;gap:5px;flex-wrap:wrap}.studio-choices button{background:transparent;border:1px solid #6c7a65;min-height:44px;padding:8px 14px;color:#e3e6d9;border-radius:3px;cursor:pointer}.studio-choices button[aria-pressed=true]{background:#d1bc91;color:#21281b;border-color:#d1bc91}.studio-main{flex:1;min-height:0;width:100%;max-width:1280px;margin:auto}.studio-main #lone-army-ui-options .studio-stages,.studio-stages>.concept-stage,.studio-stages .concept-frame{height:100%;min-height:0}.studio-main #lone-army-ui-options{height:100%;min-height:0}.studio-main #lone-army-ui-options .la-concept{height:100%;min-height:0}.studio-stages>.concept-stage[hidden]{display:none}.capture .studio-bar{display:none}
    @media(max-width:600px){.studio-bar{padding:8px 12px;gap:6px}.studio-title{font-size:12px}.studio-title small{font-size:12px}.studio-choices{width:100%}.studio-choices button{flex:1;padding:7px 8px;font-size:12px}}
  </style>
</head>
<body>
  <div id="studio">
    <header class="studio-bar">
      <p class="studio-title">《孤军》界面方案<small>只读样本 · 同一战况 · 军令仅预览，不写入存档</small></p>
      <nav class="studio-choices" aria-label="选择界面方案">
        <button type="button" data-design-choice="night" aria-pressed="true">守夜档案</button>
        <button type="button" data-design-choice="command" aria-pressed="false">前线指挥</button>
        <button type="button" data-design-choice="paper" aria-pressed="false">灰纸战报</button>
      </nav>
    </header>
    <main class="studio-main">
      <style>
/* Original interface studies. No third-party art, web fonts or production overrides. */
#lone-army-ui-options{width:100%}
#lone-army-ui-options *{box-sizing:border-box}
#lone-army-ui-options [hidden]{display:none!important}
#lone-army-ui-options .concept-frame{container-type:inline-size;width:100%;max-width:1280px;margin:auto}
#lone-army-ui-options .concept-stage{width:100%}
#lone-army-ui-options .la-concept{--ink:#eae3d4;--muted:#b7b7a7;--bg:#171c18;--surface:#202720;--raised:#293129;--rule:#4b5548;--accent:#d3b688;--accent-ink:#22281e;--danger:#edb19d;--focus:#f3d6a0;--serif:"Noto Serif CJK SC","Songti SC",SimSun,serif;--sans:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);color-scheme:dark;font:14px/1.6 var(--sans);min-height:600px;min-width:0;display:flex;flex-direction:column;isolation:isolate}
#lone-army-ui-options .theme-command{--ink:#e8ebdf;--muted:#b9c6b7;--bg:#17211c;--surface:#223128;--raised:#2b3c30;--rule:#586b58;--accent:#c8d7ad;--accent-ink:#1b2a1d;--danger:#f0b3a1;--focus:#e3eccd}
#lone-army-ui-options .theme-paper{--ink:#30352e;--muted:#626653;--bg:#e9e6dc;--surface:#f3f0e6;--raised:#dedbce;--rule:#a8aa99;--accent:#70553b;--accent-ink:#fff8e9;--danger:#8b3b2e;--focus:#755236;color-scheme:light}
#lone-army-ui-options .la-concept h1,#lone-army-ui-options .la-concept h2,#lone-army-ui-options .la-concept h3,#lone-army-ui-options .la-concept p{margin:0}
#lone-army-ui-options .la-concept button,#lone-army-ui-options .la-concept input{font:inherit;color:inherit}
#lone-army-ui-options .la-concept button{appearance:none;background:transparent;border:0;border-radius:2px;min-height:44px;min-width:44px;padding:8px 12px;cursor:pointer;touch-action:manipulation}
#lone-army-ui-options .la-concept button:disabled{cursor:default;color:var(--muted)}
#lone-army-ui-options .la-concept button:hover:not(:disabled){background:var(--raised)}
#lone-army-ui-options .la-concept :focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#lone-army-ui-options .la-concept .primary{background:var(--accent);color:var(--accent-ink);font-weight:700}
#lone-army-ui-options .la-concept .primary:hover{background:var(--accent);filter:brightness(1.06)}
#lone-army-ui-options .la-concept .outline{border:1px solid var(--rule)}
#lone-army-ui-options .la-concept small,#lone-army-ui-options .meta,#lone-army-ui-options .eyebrow{font:12px/1.6 var(--sans);color:var(--muted)}
#lone-army-ui-options .eyebrow{letter-spacing:.14em}
#lone-army-ui-options .tabular{font-variant-numeric:tabular-nums}
#lone-army-ui-options .masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--rule);flex-shrink:0}
#lone-army-ui-options .brand{font:700 25px/1 var(--serif);letter-spacing:.16em;display:flex;align-items:center;gap:13px;white-space:nowrap}
#lone-army-ui-options .brand small{letter-spacing:0;border-left:1px solid var(--rule);padding-left:12px}
#lone-army-ui-options .masthead .wordmark{padding:0;min-height:44px}
#lone-army-ui-options .masthead-right{display:flex;gap:6px;align-items:center}
#lone-army-ui-options .local-label{color:var(--muted);font-size:12px;white-space:nowrap}
#lone-army-ui-options .overview{flex-shrink:0;padding:12px 20px 0}
#lone-army-ui-options .dateline{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
#lone-army-ui-options .chapter-caption{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);flex-wrap:wrap}
#lone-army-ui-options .chapter-caption span+span{border-left:1px solid var(--rule);padding-left:9px}
#lone-army-ui-options .place-name{font:500 21px/1.4 var(--serif);letter-spacing:.06em;margin-top:2px}
#lone-army-ui-options .clock{font:500 25px/1.1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--accent);text-align:right;white-space:nowrap}
#lone-army-ui-options .clock small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
#lone-army-ui-options .metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:0 0 9px;border-bottom:1px solid var(--rule)}
#lone-army-ui-options .metric{min-width:0}
#lone-army-ui-options .metric span{display:block;color:var(--muted);font-size:12px}
#lone-army-ui-options .metric strong{font-size:21px;font-weight:500;line-height:1.4;font-variant-numeric:tabular-nums}
#lone-army-ui-options .supplies{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;padding:9px 0;border-bottom:1px solid var(--rule)}
#lone-army-ui-options .supply{min-width:0}
#lone-army-ui-options .supply span{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
#lone-army-ui-options .supply b{display:block;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
#lone-army-ui-options .supply:last-child{text-align:right}
#lone-army-ui-options .readouts{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:7px 0;font-size:12px;color:var(--muted)}
#lone-army-ui-options .readouts>span:nth-child(even){text-align:right}
#lone-army-ui-options .readouts b{font-weight:500;color:var(--ink)}
#lone-army-ui-options .workspace{display:flex;flex-direction:column;flex:1;min-height:0;position:relative}
#lone-army-ui-options .intel-note{padding:10px 20px;background:var(--surface);font-size:12px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--rule)}
#lone-army-ui-options .intel-note b{color:var(--accent);white-space:nowrap;font-weight:500}
#lone-army-ui-options .intel-note span{min-width:0;overflow-wrap:anywhere}
#lone-army-ui-options .journal{flex:1;min-height:120px;padding:22px 24px 26px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
#lone-army-ui-options .journal-header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:18px}
#lone-army-ui-options .journal-title{font:500 25px/1.5 var(--serif);letter-spacing:.08em}
#lone-army-ui-options .journal-copy{max-width:42rem;margin:auto;font:400 var(--reading-size,16px)/1.95 var(--serif);color:var(--ink);overflow-wrap:anywhere}
#lone-army-ui-options .journal-copy p+p{margin-top:1.1em}
#lone-army-ui-options .journal-copy .narrative-kicker{display:block;font:12px/1.6 var(--sans);color:var(--muted);letter-spacing:.08em;margin-bottom:16px}
#lone-army-ui-options .journal-copy blockquote{margin:23px 0 0;padding:0 0 0 16px;border-left:2px solid var(--accent);font:inherit}
#lone-army-ui-options .journal-copy blockquote p+p{margin-top:.8em}
#lone-army-ui-options .journal-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:20px;margin-top:22px;border-top:1px solid var(--rule)}
#lone-army-ui-options .journal-tools button{padding:6px 0;color:var(--muted);font-size:12px}
#lone-army-ui-options .situation{display:none;background:var(--surface);padding:20px;min-width:0}
#lone-army-ui-options .situation h3{font:500 18px/1.6 var(--serif);margin:0 0 18px}
#lone-army-ui-options .sector{padding:14px 0;border-top:1px solid var(--rule)}
#lone-army-ui-options .sector-label{display:flex;gap:12px;justify-content:space-between;font-size:13px}
#lone-army-ui-options .sector-label small{color:var(--accent)}
#lone-army-ui-options .sector-track{height:3px;background:var(--raised);margin-top:9px}
#lone-army-ui-options .sector-track span{display:block;height:3px;background:var(--accent)}
#lone-army-ui-options .sector-details{display:flex;gap:10px;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:7px}
#lone-army-ui-options .command-side{display:none}
#lone-army-ui-options .command-dock{flex-shrink:0;padding:10px 18px 14px;background:var(--surface);border-top:1px solid var(--rule)}
#lone-army-ui-options .quick-actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-bottom:10px}
#lone-army-ui-options .quick-action{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;padding:8px 10px!important;text-align:left;border:1px solid var(--rule)!important;min-width:0;line-height:1.5}
#lone-army-ui-options .quick-action b{font-weight:500;font-size:14px}
#lone-army-ui-options .quick-action span{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
#lone-army-ui-options .quick-action:first-child{border-color:var(--accent)!important}
#lone-army-ui-options .command-form{display:flex;gap:8px;align-items:stretch}
#lone-army-ui-options .command-input{background:var(--bg);border:1px solid var(--muted);border-radius:2px;min-width:0;min-height:46px;flex:1;padding:10px 12px;font-size:16px!important;line-height:1.4}
#lone-army-ui-options .command-input::placeholder{color:var(--muted);opacity:1}
#lone-army-ui-options .command-form .primary{flex-shrink:0;padding:8px 14px}
#lone-army-ui-options .dock-tools{display:flex;gap:2px;align-items:center;justify-content:space-between;margin-top:3px}
#lone-army-ui-options .dock-tools button{font-size:12px;padding:6px 8px;min-height:44px}
#lone-army-ui-options .dock-tools>span{font-size:12px;color:var(--muted)}
#lone-army-ui-options .compact-cost{font-size:12px;color:var(--accent);padding:0 0 7px;line-height:1.7}
#lone-army-ui-options .compact-cost:empty{display:none}
#lone-army-ui-options .empty-space{flex:1}
#lone-army-ui-options .menu-content{flex:1;min-height:0;overflow-y:auto;padding:22px 22px 26px}
#lone-army-ui-options .menu-hero{margin-bottom:28px}
#lone-army-ui-options .menu-hero h1{font:500 44px/1.2 var(--serif);letter-spacing:.14em;margin:10px 0 14px}
#lone-army-ui-options .menu-hero .subtitle{font:16px/1.9 var(--serif);color:var(--muted)}
#lone-army-ui-options .chapter-picker{display:flex;flex-direction:column;margin:0 0 18px}
#lone-army-ui-options .chapter-option{display:flex;align-items:center;gap:15px;padding:16px 4px!important;text-align:left;border-bottom:1px solid var(--rule)!important;border-radius:0!important;min-height:83px}
#lone-army-ui-options .chapter-option[aria-pressed=true]{padding-left:12px!important;border-left:3px solid var(--accent)!important;background:var(--surface)}
#lone-army-ui-options .chapter-number{font:22px/1.2 var(--serif);color:var(--accent);min-width:24px}
#lone-army-ui-options .chapter-option h3{font:500 20px/1.6 var(--serif);letter-spacing:.06em}
#lone-army-ui-options .chapter-option .meta{font-size:12px}
#lone-army-ui-options .chapter-option .arrow{margin-left:auto;color:var(--accent)}
#lone-army-ui-options .chapter-brief{padding:10px 0 20px;border-bottom:1px solid var(--rule)}
#lone-army-ui-options .chapter-brief p+p{margin-top:8px}
#lone-army-ui-options .tactic-preview{margin-top:18px}
#lone-army-ui-options .tactic-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
#lone-army-ui-options .tactic-list button{padding:12px;text-align:left;border:1px solid var(--rule);display:flex;flex-direction:column;gap:4px}
#lone-army-ui-options .menu-footer{margin-top:20px;font-size:12px;color:var(--muted)}
#lone-army-ui-options .menu-dock{padding:14px 20px;background:var(--surface);border-top:1px solid var(--rule);flex-shrink:0}
#lone-army-ui-options .menu-dock .primary{display:flex;justify-content:space-between;align-items:center;width:100%;font-size:15px;min-height:50px;margin-top:8px}
#lone-army-ui-options .menu-dock .meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
#lone-army-ui-options dialog{width:min(560px,calc(100% - 28px));max-height:85vh;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:4px;padding:22px;font:14px/1.8 var(--sans);overflow:auto}
#lone-army-ui-options dialog::backdrop{background:#060b08c9}
#lone-army-ui-options .dialog-head{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid var(--rule);padding-bottom:12px;margin-bottom:18px}
#lone-army-ui-options .dialog-head h2{font:500 22px/1.5 var(--serif)}
#lone-army-ui-options .dialog-head form{margin:0}
#lone-army-ui-options .dialog-head button{border:1px solid var(--rule)}
#lone-army-ui-options .dialog-body p+p{margin-top:14px}
#lone-army-ui-options .dialog-body .cost-line{font-size:18px;color:var(--accent);margin:12px 0}
#lone-army-ui-options .dialog-body .unavailable{color:var(--danger)}
#lone-army-ui-options .dialog-body button{width:100%;border-bottom:1px solid var(--rule);text-align:left;display:flex;justify-content:space-between;gap:12px}
#lone-army-ui-options .dialog-body button span{font-size:12px;color:var(--muted)}
#lone-army-ui-options .theme-night .masthead{border-bottom:0;padding-bottom:2px}
#lone-army-ui-options .theme-night .overview{padding-top:4px}
#lone-army-ui-options .theme-night.mode-game .dateline{display:none}
#lone-army-ui-options .brand-compact{display:block;letter-spacing:.08em;text-align:left}
#lone-army-ui-options .night-title{display:flex;align-items:center;gap:10px}
#lone-army-ui-options .night-title small{border:0!important;padding:0!important;letter-spacing:0;font-size:12px}
#lone-army-ui-options .night-context{display:block;font:12px/1.6 var(--sans);letter-spacing:0;color:var(--muted);margin-top:5px}
#lone-army-ui-options .header-time{font:500 24px/1.2 var(--sans);color:var(--accent);text-align:right;letter-spacing:.02em}
#lone-army-ui-options .header-time small{display:block;font-size:12px;color:var(--muted);margin-top:3px}
#lone-army-ui-options .settlement-note{font:13px/1.8 var(--sans);color:var(--muted);padding-top:2px}
#lone-army-ui-options .theme-night .journal-title{font-size:27px}
#lone-army-ui-options .theme-night .journal-header{align-items:flex-end}
#lone-army-ui-options .theme-night .quick-action:nth-child(3){border-color:transparent!important}
#lone-army-ui-options .theme-night .journal-copy{padding-top:2px}
#lone-army-ui-options .theme-night .journal-copy blockquote{padding-left:18px}
#lone-army-ui-options .theme-command .masthead{padding-top:8px;padding-bottom:8px;background:var(--surface)}
#lone-army-ui-options .theme-command .brand{font:500 22px/1 var(--sans);letter-spacing:.1em}
#lone-army-ui-options .theme-command .place-name{font:500 18px/1.6 var(--sans)}
#lone-army-ui-options .theme-command .dateline{margin-bottom:8px}
#lone-army-ui-options .theme-command .overview{display:grid;grid-template-columns:1.05fr 1fr;column-gap:14px}
#lone-army-ui-options .theme-command .dateline{grid-column:1/-1}
#lone-army-ui-options .theme-command .metrics{grid-column:1;grid-row:2;grid-template-columns:1fr 1fr;gap:1px;border:0;background:var(--rule);padding:0;margin:0}
#lone-army-ui-options .theme-command .metric{padding:6px 12px;background:var(--surface)}
#lone-army-ui-options .theme-command .supplies{grid-column:2;grid-row:2;grid-template-columns:1fr!important;padding:0 0 0 12px;border:0;border-left:1px solid var(--rule);align-content:space-between}
#lone-army-ui-options .theme-command .supply{display:flex;justify-content:space-between;align-items:center;gap:8px}
#lone-army-ui-options .theme-command .readouts{grid-column:1/-1;margin-top:9px;border-top:1px solid var(--rule)}
#lone-army-ui-options .theme-command .journal{padding-top:18px}
#lone-army-ui-options .theme-command .journal-title{font:500 21px/1.5 var(--sans);letter-spacing:.04em}
#lone-army-ui-options .theme-command .journal-copy{font-family:var(--sans);line-height:1.85}
#lone-army-ui-options .theme-command .quick-action{background:var(--raised);border-color:var(--rule)!important}
#lone-army-ui-options .theme-command .menu-hero h1{font-family:var(--sans);font-size:36px;letter-spacing:.12em}
#lone-army-ui-options .theme-command .chapter-picker{gap:10px}
#lone-army-ui-options .theme-command .chapter-option{border:1px solid var(--rule)!important;border-radius:3px!important;padding:13px!important;background:var(--surface)}
#lone-army-ui-options .theme-command .chapter-option[aria-pressed=true]{border-color:var(--accent)!important;background:var(--raised)}
#lone-army-ui-options .theme-paper .masthead{background:var(--ink);color:var(--bg);padding-top:12px;padding-bottom:12px;border:0}
#lone-army-ui-options .theme-paper .masthead .brand small,#lone-army-ui-options .theme-paper .masthead .local-label{color:#d5d5c7}
#lone-army-ui-options .theme-paper .masthead button:hover{background:#444b40}
#lone-army-ui-options .theme-paper .overview{padding-top:18px}
#lone-army-ui-options .theme-paper .dateline{padding-bottom:9px;border-bottom:2px solid var(--ink);margin-bottom:10px}
#lone-army-ui-options .theme-paper .metrics{border-bottom:0;padding-bottom:4px}
#lone-army-ui-options .theme-paper .metric strong{font-family:var(--serif);font-size:23px}
#lone-army-ui-options .theme-paper .intel-note{background:transparent;border-bottom:1px solid var(--rule);padding-top:6px;padding-bottom:10px}
#lone-army-ui-options .theme-paper .journal{padding-top:24px}
#lone-army-ui-options .theme-paper .journal-title{font-size:28px;letter-spacing:.1em}
#lone-army-ui-options .theme-paper .journal-header{display:flex;flex-direction:column;align-items:center;gap:7px;border-bottom:1px solid var(--rule);padding-bottom:17px;margin-bottom:16px}
#lone-army-ui-options .theme-paper .journal-header .eyebrow{order:-1;letter-spacing:.3em}
#lone-army-ui-options .theme-paper .narrative-kicker{text-align:center}
#lone-army-ui-options .theme-paper .journal-copy{line-height:2.05}
#lone-army-ui-options .theme-paper .journal-copy blockquote{border:0;padding:16px 0 0;border-top:1px solid var(--rule)}
#lone-army-ui-options .theme-paper .quick-actions{display:none}
#lone-army-ui-options .theme-paper .command-dock{background:var(--surface)}

    function metricsMarkup(){
      const d=sample(),s=d.stats;const short=state.chapterId!=='sihang';
      const metrics=short?[['可战',d.combatReady,'combatReady'],['伤员',s.wounded,'wounded'],[state.chapterId==='street'?'安全抵达':'已过桥',state.chapterId==='street'?s.mission.evacuated:s.mission.crossed,'progress'],['距封锁',`${180-s.mission.elapsedMinutes}分`,'remaining']]:[['可战',d.combatReady,'combatReady'],['伤员',s.wounded,'wounded'],['士气',s.morale,'morale'],['总结构',s.health,'health']];
      const supplies=short?[['七九弹',s.ammo,'ammo'],['急救包',s.medkits,'medkits'],...(state.chapterId==='bridge'?[['工事材料',s.sandbags,'sandbags']]:[])]:[['七九弹',s.ammo,'ammo'],['机枪弹',s.machineGunAmmo,'machineGunAmmo'],['手榴弹',s.grenades,'grenades'],['工事材料',s.sandbags,'sandbags'],['急救包',s.medkits,'medkits']];
      return `<div class="dateline"><div><div class="chapter-caption"><span>${escape(chapter().title)}</span><span>${short?'虚构支线':`第${s.day}天`}</span></div><div class="place-name">${short?escape(chapter().subtitle):escape(s.location)}</div></div><div class="clock">${s.currentTime}<small>${short?'本章开场':escape(d.date)}</small></div></div>
        <div class="metrics">${metrics.map(([k,v,key])=>`<div class="metric"><span>${k}</span><strong data-field="${key}" data-value="${escape(v)}">${typeof v==='number'?number(v):escape(v)}</strong></div>`).join('')}</div>
        <div class="supplies" style="grid-template-columns:repeat(${supplies.length},minmax(0,1fr))" aria-label="现有物资">${supplies.map(([k,v,key])=>`<div class="supply"><span>${k}</span><b data-field="${key}" data-value="${v}">${number(v)}</b></div>`).join('')}</div>
        <div class="readouts"><span>压力 <b>${s.siegeMeter}%</b></span><span>疲劳 <b>${s.fatigue}%</b></span>${short?'':`<span>接敌 <b>${s.enemyOperation?`${s.enemyOperation.turnsRemaining}回合${s.enemyOperation.revealed?'':' · 目标未明'}`:'重整中'}</b></span><span>国旗 <b>${s.hasFlagRaised?'飘扬':'未升起'}</b></span>`}</div>`;
    }
    function journalMarkup(){
      const d=sample();const opening=host.dataset.sample==='opening'||state.chapterId!=='sihang';
      const text=opening?d.history[0].text:d.history.at(-1).text;
      const chunks=text.split(/\n\n+/).filter(p=>p&&!/^【/.test(p));
      if(opening&&state.chapterId==='sihang')chunks.shift();
      const body=chunks.map(p=>p.startsWith('💤 ')?`<p class="settlement-note">${escape(p.slice(3))}</p>`:paragraphs(p)).join('');
      return `<div class="journal-header"><h2 class="journal-title">${escape(chapter().subtitle)}</h2><span class="eyebrow">${opening?'入驻记录':'作战记录'}</span></div>
        <div class="journal-copy"><span class="narrative-kicker">${escape(d.date)} · ${d.stats.currentTime}　${state.chapterId==='sihang'?'四行仓库':'虚构支线'}</span>${body}${d.dialogue&&!opening?`<blockquote><span class="meta">你说：我有点害怕</span>${paragraphs(d.dialogue)}</blockquote>`:''}
        <div class="journal-tools"><button type="button" data-action="history">查看完整战报 →</button><span class="meta">${d.history.length}条记录</span></div></div>`;
    }
    function menuMarkup(){
      const c=chapter();
      return `<div class="menu-hero"><p class="eyebrow">文字策略 / 一九三七</p><h1>孤军</h1><p class="subtitle">不同的阵地，<br>许多个想回家的人。</p><p class="meta" style="margin-top:22px">三处阵地，三份独立记录。</p></div>
        <div class="chapter-picker" aria-label="章节选择">${data.chapters.map(c=>`<button type="button" class="chapter-option" data-action="chapter" data-chapter="${c.id}" aria-pressed="${c.id===state.chapterId}"><span class="chapter-number">${c.number}</span><div><p class="meta">${escape(c.setting)}</p><h3>${escape(c.title)}</h3><p class="meta">${escape(c.subtitle)}</p></div><span class="arrow" aria-hidden="true">${c.id===state.chapterId?'✓':'→'}</span></button>`).join('')}</div>
        <section class="chapter-brief" aria-label="章节说明"><p class="eyebrow">本章任务</p><p>${escape(c.objective)}</p><p class="meta">${escape(c.duration)}</p></section>
        <section class="tactic-preview"><p class="eyebrow">本章战术 · 二选一</p><p class="meta">当前样本：不携带，可查看两张牌的规则。</p><div class="tactic-list">${c.tactics.map((t,i)=>`<button type="button" data-action="tactic" data-index="${i}"><b>${escape(t.title)}</b><span class="meta">查看效果与代价 →</span></button>`).join('')}</div></section>
        <p class="menu-footer">成人战争叙事，含具体伤势、死亡与战地创伤。前两章为虚构支线，演绎不作史料。</p>`;
    }
    function render(){
      const d=sample(),s=d.stats;const opening=s.tutorialStep===1&&state.chapterId==='sihang';
      root.className=`la-concept theme-${design} mode-${state.view}`;
      root.dataset.chapter=state.chapterId;root.dataset.stateHash=d.stateHash;
      root.setAttribute('aria-label',{'night':'守夜档案','command':'前线指挥','paper':'灰纸战报'}[design]+'界面');
      const compact=design==='night'&&state.view==='game';
      const brand=compact?`<span class="brand brand-compact"><span class="night-title">孤军<small>${escape(chapter().title)}</small></span><span class="night-context">${state.chapterId==='sihang'?`第${s.day}天 · ${escape(s.location)}`:'虚构支线 · 独立小队'}</span></span>`:`<span class="brand">孤军<small>${state.view==='menu'?'战役档案':state.chapterId==='sihang'?'一九三七':chapter().title}</small></span>`;
      const headerState=compact?`<div class="header-time tabular">${s.currentTime}<small>${escape(d.date)}</small></div>`:'<span class="local-label">本地游玩</span>';
      root.innerHTML=`<header class="masthead"><button type="button" class="wordmark" data-action="menu" aria-label="返回章节">${brand}</button><div class="masthead-right">${headerState}<button type="button" data-action="${state.view==='menu'?'game':'menu'}">${state.view==='menu'?'看战报':'章节'}</button></div></header>
        <section class="overview" aria-label="战况与物资">${metricsMarkup()}</section>
        <div class="workspace"><div class="intel-note"><b>${opening?'当前目标':'本章任务'}</b><span>${opening?'先加固一楼入口，再让守军轮换休息。':escape(chapter().objective)}</span></div><aside class="situation" aria-label="阵地详情">${sectorMarkup()}</aside><article class="journal" aria-label="作战记录">${journalMarkup()}</article></div>
        <footer class="command-dock" aria-label="军令与对话"><h3 class="command-side">指挥区</h3><div class="quick-actions">${d.previews.slice(0,design==='night'?2:3).map(actionButton).join('')}${design==='night'?'<button type="button" class="quick-action" data-action="actions"><b>全部军令</b><span>先查看代价 →</span></button>':''}</div><div class="empty-space"></div><p class="compact-cost" aria-live="polite"></p><form class="command-form"><input id="${design}-command" class="command-input" aria-label="军令或对话" placeholder="下令，或说两句话" autocomplete="off" value="${escape(state.input)}"><button type="submit" class="primary" aria-label="查看输入的军令预览">预览</button></form><div class="dock-tools"><button type="button" data-action="map">${state.chapterId==='sihang'?'阵地':'任务'}</button><button type="button" data-action="advisor">顾问</button><button type="button" data-action="actions">军令</button><span>交谈不耗时</span></div></footer>
        <section class="menu-content" aria-label="章节与战术">${menuMarkup()}</section><footer class="menu-dock"><div><div class="meta"><span>${escape(chapter().title)}</span><span>样本战术：不携带</span></div><button type="button" class="primary" data-action="game"><span>预览${escape(chapter().title)}</span><span aria-hidden="true">→</span></button></div></footer>
        <dialog aria-labelledby="${design}-dialog-heading"><div class="dialog-head"><h2 id="${design}-dialog-heading"></h2><form method="dialog"><button type="submit" aria-label="关闭窗口">关闭</button></form></div><div class="dialog-body"></div></dialog>`;
      root.style.setProperty('--reading-size',state.readingSize+'px');
    }
    function modal(title,body){const dialog=root.querySelector('dialog');dialog.querySelector('h2').textContent=title;dialog.querySelector('.dialog-body').innerHTML=body;if(!dialog.open)dialog.showModal();else dialog.querySelector('button').focus();}
    function showPreview(index){
      const a=sample().previews[index];if(!a)return;
      const p=a.preview;const blocked=a.tutorialBlocked||!p?.available;
      const cost=p?.costs?.length?p.costs.join(' · '):'无额外物资消耗';
      modal(`军令预览 · ${a.label}`,`<p class="eyebrow">${escape(a.command)}</p>${blocked?`<p class="unavailable">当前不可执行：${escape(a.tutorialBlocked?'先完成当前新手引导':p?.reason||'未识别为行动')}</p>`:`<p class="cost-line">${escape(p.durationLabel)} · ${escape(cost)}</p><p>${escape(p.riskLabel)}</p><p>${escape(p.reason)}</p>`}<p class="meta" style="margin-top:22px">只读界面样本：尚未执行军令，时间与资源保持原值。</p>`);
    }
    root.addEventListener('click',event=>{
      const control=event.target.closest('button[data-action]');if(!control)return;
      switch(control.dataset.action){
        case'menu':state.view='menu';render();break;
        case'game':state.view='game';render();break;
        case'chapter':state.chapterId=control.dataset.chapter;state.input='';render();break;
        case'preview':showPreview(Number(control.dataset.index));break;
        case'actions':modal('常用军令',sample().previews.map((a,i)=>`<button type="button" data-action="preview" data-index="${i}"><b>${escape(a.label)}</b><span>${escape(a.tutorialBlocked?'先完成引导':a.preview?.short||'未识别')}</span></button>`).join('')+'<p class="meta" style="margin-top:16px">选择军令查看规则和代价；此样本不执行行动。</p>');break;
        case'map':modal(state.chapterId==='sihang'?'仓库阵地':'本章任务',sectorMarkup());break;
        case'advisor':modal('战地顾问',`<p class="eyebrow">回答与预览，不执行军令</p><p>${escape(chapter().objective)}</p><p>${escape(sample().intel||'先明确本章任务和行动代价。')}</p><p class="meta" style="margin-top:18px">本地只读说明；没有发送模型请求。</p>`);break;
        case'history':modal('完整战报',sample().history.map((h,i)=>`<p class="eyebrow" style="margin-top:20px">${i+1} · ${escape(h.command==='start_game'?'开场':h.command)}</p>${paragraphs(h.text)}`).join(''));break;
        case'tactic':{const t=chapter().tactics[Number(control.dataset.index)];modal(t.title,`${paragraphs(t.description)}<p class="cost-line">${escape(t.effect)}</p><p>${escape(t.tradeoff)}</p><p class="meta" style="margin-top:18px">此处只查看战术说明，未改变样本装备。</p>`);break;}
      }
    });
    root.addEventListener('input',event=>{
      if(!event.target.matches('.command-input'))return;
      state.input=event.target.value;
      const a=sample().previews.find(p=>p.command===state.input.trim());
      root.querySelector('.compact-cost').textContent=a?`${a.label} · ${a.preview?.short||'先查看规则'}`:'';
    });
    root.addEventListener('submit',event=>{
      if(!event.target.matches('.command-form'))return;
      event.preventDefault();const i=sample().previews.findIndex(p=>p.command===state.input.trim());
      if(i>=0)showPreview(i);else modal('军令与对话',`<p>${state.input.trim()?`已输入：${escape(state.input)}`:'可以先从常用军令中选择一项，查看时间、物资和风险。'}</p><p class="meta" style="margin-top:18px">这是一份只读界面样本，没有执行军令、写入存档或请求模型。</p>`);
    });
    render();
    if(globalThis.Tweak){
      const tweak=new Tweak({container:root,onChange:()=>root.style.setProperty('--reading-size',state.readingSize+'px')});
      tweak.addSlider(state,'readingSize',{label:'正文大小',min:16,max:20,step:1,unit:'px',reference:'--reading-size'});
    }
  }
})();

</script>

    </main>
  </div>
  <noscript>请启用JavaScript查看界面样本。此页面只做预览，不执行游戏军令。</noscript>
  <script>
    const parameters=new URLSearchParams(location.search);
    const chosen=parameters.get('concept')||'command';
    const options=document.getElementById('lone-army-ui-options');
    if(parameters.get('capture')==='1')document.body.classList.add('capture');
    function chooseDesign(value){
      if(!['night','command','paper'].includes(value))value='night';
      for(const section of options.querySelectorAll('.concept-stage'))section.hidden=section.querySelector('[data-concept]').dataset.concept!==value;
      for(const button of document.querySelectorAll('[data-design-choice]'))button.setAttribute('aria-pressed',String(button.dataset.designChoice===value));
      document.title='孤军 · '+{night:'守夜档案',command:'前线指挥',paper:'灰纸战报'}[value];
    }
    for(const button of document.querySelectorAll('[data-design-choice]'))button.addEventListener('click',()=>chooseDesign(button.dataset.designChoice));
    chooseDesign(chosen);
  </script>
</body>
